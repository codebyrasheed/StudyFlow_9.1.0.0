name: study_flow
description: Assignments, exams and habits tracker with a glassmorphism UI.
publish_to: 'none'
version: 2.12.1+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: '>=0.18.0 <1.0.0'
  shared_preferences: ^2.2.2
  table_calendar: ^3.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0
  url_launcher: ^6.3.0
  file_picker: ^10.3.8
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  pdfrx: '>=2.4.6 <2.5.0'
  permission_handler: ^12.0.0
  share_plus: ^10.1.4
  wakelock_plus: ^1.2.8

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
